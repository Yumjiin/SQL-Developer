spring:
  application:
    name: sqld-backend

  # 개발용 H2 DB. backend/data 폴더에 파일로 저장돼서 서버를 껐다 켜도 데이터가 남습니다.
  datasource:
    url: jdbc:h2:file:./data/sqld
    username: sa
    password:

  # 브라우저에서 DB 내용을 직접 볼 수 있는 화면: http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update        # 엔티티를 보고 테이블을 자동으로 만들거나 고침 (개발용)
    open-in-view: false
    show-sql: true            # 실행되는 SQL을 콘솔에 출력 → SQLD 공부에도 도움
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080
